<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="robots" content="noindex, nofollow">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>자이씨앤에이 유사 수행사례 제안</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style id="rw-style">
:root{
  --paper:#FFFFFF; --sunk:#F4F6FA; --ink:#1E2B45; --body:#2C3238; --soft:#39414D;
  --muted:#5C6675; --faint:#8A93A1; --line:#E1E5EC; --chip:#F2F3F5; --chip-ink:#5D6674;
  --why-bg:#FDF7E7; --why-line:#E3BE6B; --why-ink:#3A3730; --pill-ink:#FFFFFF;
  --focus:#39557F; --danger:#B4453C;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --paper:#12161F; --sunk:#1A2130; --ink:#D9E3F2; --body:#C3CBD8; --soft:#B2BBC9;
    --muted:#8B95A6; --faint:#6E7788; --line:#28313F; --chip:#212A38; --chip-ink:#9AA4B4;
    --why-bg:#241F14; --why-line:#8A6F32; --why-ink:#D8CDB4; --pill-ink:#0F131A;
    --focus:#8FA9D6; --danger:#E08078;
  }
}
:root[data-theme="dark"]{
  --paper:#12161F; --sunk:#1A2130; --ink:#D9E3F2; --body:#C3CBD8; --soft:#B2BBC9;
  --muted:#8B95A6; --faint:#6E7788; --line:#28313F; --chip:#212A38; --chip-ink:#9AA4B4;
  --why-bg:#241F14; --why-line:#8A6F32; --why-ink:#D8CDB4; --pill-ink:#0F131A;
  --focus:#8FA9D6; --danger:#E08078;
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--paper); color:var(--body);
  font-family:"Noto Sans KR","Noto Sans CJK KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  font-size:15px; line-height:1.78; word-break:keep-all; overflow-wrap:anywhere;
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:760px;margin:0 auto;padding:44px 24px 88px}
img{max-width:100%}

.masthead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.logo{height:22px;width:auto;display:block}
.wordmark{font-weight:900;font-size:19px;color:#00CCAA;letter-spacing:.08em}
.tools{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.tb{border:0;background:none;padding:0;font:inherit;font-size:11.5px;color:var(--faint);
  cursor:pointer;text-decoration:underline;text-underline-offset:3px;letter-spacing:.01em}
.tb:hover{color:var(--ink)}
.tb:focus-visible{outline:2px solid var(--focus);outline-offset:3px;border-radius:2px}
.tb[disabled]{opacity:.55;cursor:progress;text-decoration:none}
.tb.pri{border:1px solid var(--ink);border-radius:5px;padding:3px 11px;color:var(--ink);
  font-weight:700;text-decoration:none}
.tb.pri:hover{background:var(--ink);color:var(--paper)}

.hint{margin:14px 0 0;font-size:12.5px;color:var(--muted);background:var(--sunk);
  border-radius:7px;padding:9px 13px}
.note{margin:14px 0 0;font-size:12.5px;color:var(--danger)}
.note.ok{color:var(--muted)}

.eyebrow{margin-top:22px;font-size:11px;letter-spacing:.22em;color:var(--muted);font-weight:700}
h1{margin:10px 0 0;font-size:clamp(26px,4.4vw,34px);font-weight:700;color:var(--ink);
   letter-spacing:-.02em;line-height:1.3;text-wrap:balance}
.notice{margin-top:12px;font-size:12px;color:var(--faint);line-height:1.65}
.rule{border-top:2.4px solid var(--ink);margin:22px 0 34px}

.sec{margin-bottom:40px}
.sec:last-child{margin-bottom:0}
h2{margin:0 0 16px;font-size:18px;font-weight:700;color:var(--ink);line-height:1.4;
   padding-left:12px;border-left:4px solid var(--ink)}
p{margin:0 0 12px}
p:last-child{margin-bottom:0}

.box-brief{background:var(--sunk);border-radius:11px;padding:22px 26px;color:var(--soft);line-height:1.9}
.dir p{line-height:1.9}

.cards{display:flex;flex-direction:column;gap:18px}
.card{border:1px solid var(--line);border-radius:12px;padding:24px 26px 26px}
.card-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pill{background:var(--ink);color:var(--pill-ink);font-size:11.5px;font-weight:700;border-radius:999px;
  padding:3px 12px;white-space:nowrap;letter-spacing:.02em}
.card-title{margin:0;font-size:18px;font-weight:700;color:var(--ink);line-height:1.42}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:12px 0 20px}
.chips span.chip{background:var(--chip);color:var(--chip-ink);font-size:11.5px;border-radius:5px;padding:3px 9px}
.lbl{font-size:13.5px;font-weight:700;color:var(--soft);margin:20px 0 8px}
.card > .lbl:first-of-type{margin-top:0}
.box-why{background:var(--why-bg);border-left:3px solid var(--why-line);border-radius:6px;
  padding:16px 19px;font-size:14.5px;line-height:1.85;color:var(--why-ink)}
ul{margin:0;padding-left:19px}
.dir p{margin:0 0 12px}
.dir p.dir-b{margin:0 0 9px;padding-left:1.1em;text-indent:-1.1em}
.dir p.dir-b+p:not(.dir-b){margin-top:16px}
li{margin-bottom:7px;font-size:14.5px;line-height:1.8}
li:last-child{margin-bottom:0}
.body-t{font-size:14.5px;line-height:1.82;color:var(--soft)}
.btn-row{margin-top:20px}
.btn{display:inline-block;border:1.4px solid var(--ink);color:var(--ink);font-size:13.5px;font-weight:700;
  border-radius:6px;padding:8px 17px;text-decoration:none}
.btn:hover{background:var(--ink);color:var(--paper)}
.btn:focus-visible{outline:2px solid var(--focus);outline-offset:2px}

.vid{display:flex;gap:18px;align-items:flex-start;margin-bottom:14px}
.vid-thumb{width:190px;flex:0 0 190px;border-radius:7px;overflow:hidden;border:1px solid var(--line);position:relative}
.vid-thumb img{width:100%;display:block}
.vid-dur{position:absolute;right:5px;bottom:5px;background:rgba(20,26,38,.85);color:#fff;font-size:11px;
  border-radius:3px;padding:1px 6px}
.vid-meta{flex:1;min-width:0}
.vid-byline{margin:7px 0 0;font-size:13px;color:var(--faint)}
.thumb-ph{width:100%;aspect-ratio:16/9;background:#1E2B45;color:#fff;display:flex;align-items:center;
  justify-content:center;font-size:12px;text-align:center;padding:10px;line-height:1.45}
@media (max-width:560px){
  .vid{flex-direction:column;gap:12px}
  .vid-thumb{width:100%;flex:0 0 auto}
}

.foot{margin-top:56px;padding-top:14px;border-top:1px solid var(--line);display:flex;
  justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;font-size:12.5px;color:var(--faint)}
.foot a{color:inherit}
.foot-l{display:flex;align-items:center;gap:14px;flex-wrap:wrap}

/* --- 편집 모드 --- */
.rw-x{display:inline-flex;align-items:center;justify-content:center;vertical-align:middle;
  width:16px;height:16px;margin-left:5px;border:0;border-radius:50%;background:none;
  color:var(--faint);font:inherit;font-size:12px;line-height:1;cursor:pointer;padding:0;flex:0 0 auto}
.rw-x:hover{background:var(--danger);color:var(--paper)}
.rw-x:focus-visible{outline:2px solid var(--focus);outline-offset:1px}

.rw-del{margin-left:auto;border:1px solid var(--line);background:var(--paper);color:var(--muted);
  font:inherit;font-size:11.5px;border-radius:5px;padding:3px 10px;cursor:pointer;white-space:nowrap}
.rw-del:hover{border-color:var(--danger);background:var(--danger);color:var(--paper)}
.rw-del:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
/* 무엇이 지워지는지 카드 전체로 보여준다 */
.rw-item:has(.rw-del:hover){outline:2px solid var(--danger);outline-offset:2px}
.rw-item:has(.rw-del:hover) > *:not(.card-head){opacity:.35}
.rw-item:has(.rw-del:hover) .card-title{text-decoration:line-through;text-decoration-color:var(--danger)}

.editing [contenteditable]{outline:1px dashed var(--line);outline-offset:5px;border-radius:2px}
.editing [contenteditable]:hover{outline-color:var(--muted)}
.editing [contenteditable]:focus{outline:2px solid var(--focus);outline-offset:5px}
.editing .box-brief[contenteditable],.editing .box-why[contenteditable]{outline-offset:2px}
.editing .btn{pointer-events:none;opacity:.55}

@media print{
  @page{size:A4;margin:16mm 15mm 22mm}
  html,body{background:#fff}
  body{font-size:10.5pt;line-height:1.72;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .wrap{max-width:none;width:auto;padding:0}
  .tools,.hint,.note,.rw-x{display:none!important}
  .eyebrow{margin-top:14px}
  .rule{margin:16px 0 24px}
  .sec{margin-bottom:26px}
  .dir p.dir-b{margin:0 0 8px}
  .cards{gap:13px}
  .card{padding:17px 20px 19px;break-inside:auto;page-break-inside:auto}
  .vcard,.box-brief,.box-why p,li{break-inside:avoid;page-break-inside:avoid}
  .box-why{orphans:2;widows:2}
  .box-brief{padding:16px 19px;line-height:1.8}
  .box-why{line-height:1.78}
  h1{font-size:23pt}
  h2{font-size:13pt;margin-bottom:11px}
  .card-title{font-size:12.6pt}
  li,.body-t,.box-why{font-size:10pt}
  h2,.lbl,.chips,.card-head{break-after:avoid;page-break-after:avoid}
  .foot{margin-top:30px;padding-top:10px;font-size:8pt}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

  function caseCard(c, i){
    var h = '<article class="card' + (editing ? ' rw-item' : '') + '">';
    h += '<div class="card-head"><span class="pill">추천 ' + (i+1) + '</span>' +
         T('h3', ['cases', i, 'title'], 'card-title') +
         (editing ? DelItem(['cases', i], '이 사례 전체 삭제') : '') + '</div>';
    var chips = c.chips || [];
    if (chips.length){
      h += '<div class="chips">';
      for (var k = 0; k < chips.length; k++)
        h += '<span class="chip">' + T('span', ['cases', i, 'chips', k]) + (editing ? DelChip(['cases', i, 'chips', k]) : '') + '</span>';
      h += '</div>';
    }
    if ((c.why || []).length)
      h += '<div class="lbl">이 사례를 추천하는 이유</div>' + Block('div', ['cases', i, 'why'], 'box-why', 'p');
    if (c.situation)
      h += '<div class="lbl">당시 고객 상황</div><div class="body-t">' + T('p', ['cases', i, 'situation']) + '</div>';
    if ((c.approach || []).length)
      h += '<div class="lbl">리얼워크의 접근</div>' + Block('ul', ['cases', i, 'approach'], 'app-list', 'li');
    if (c.result)
      h += '<div class="lbl">결과</div><div class="body-t">' + T('p', ['cases', i, 'result']) + '</div>';
    h += '<div class="btn-row"><a class="btn" href="https://www.realwork.group/library/case-study/' +
         esc(c.slug) + '" target="_blank" rel="noopener">사례 자세히 보기</a></div>';
    return h + '</article>';
  }

  function vidCard(v, i){
    var th = v._thumb ? '<img src="' + v._thumb + '" alt="' + esc(v.title) + '">'
                      : (LOCAL ? '<img src="https://i.ytimg.com/vi/' + esc(v.yid) + '/hqdefault.jpg" alt="' + esc(v.title) + '" onerror="this.outerHTML=\'<div class=thumb-ph>\'+this.alt+\'</div>\'">'
                               : '<div class="thumb-ph">' + esc(v.title) + '</div>');
    var h = '<article class="card vcard' + (editing ? ' rw-item' : '') + '"><div class="vid">';
    h += '<div class="vid-thumb">' + th + '<span class="vid-dur">' + esc(v.dur || '') + '</span></div>';
    h += '<div class="vid-meta"><div class="card-head"><span class="pill">추천 ' + (i+1) + '</span>' +
         T('h3', ['videos', i, 'title'], 'card-title') +
         (editing ? DelItem(['videos', i], '이 영상 전체 삭제') : '') + '</div>' +
         '<p class="vid-byline">' + T('span', ['videos', i, 'who']) + '</p></div></div>';
    if (v.why)
      h += '<div class="lbl">이 영상을 추천하는 이유</div><div class="box-why">' + T('p', ['videos', i, 'why']) + '</div>';
    h += '<div class="btn-row"><a class="btn" href="https://www.youtube.com/watch?v=' + esc(v.yid) +
         '" target="_blank" rel="noopener">영상 보기</a></div>';
    return h + '</article>';
  }

  function bodyHtml(){
    var d = state, i, h = '<div class="wrap"><header><div class="masthead">';
    h += d._logo ? '<img class="logo" src="' + d._logo + '" alt="REALWORK">'
                 : '<div class="wordmark">REALWORK</div>';
    h += '</div>';
    h += '<div class="eyebrow">리얼워크 AI큐레이션</div>';
    h += '<h1>' + T('span', ['client']) + ' 유사 수행사례 제안</h1>';
    h += '<p class="notice">* 본 문서는 리얼워크 AI를 통해 만들어진 문서로, 추천 방향은 추후 논의 및 계획에 따라 변경될 수 있습니다.</p>';
    h += '<div class="rule"></div></header>';

    if ((d.brief || []).length)
      h += '<section class="sec"><h2>' + esc(d.brief_label || '지난 문의/상담 요약') + '</h2>' +
           Block('div', ['brief'], 'box-brief', 'p') + '</section>';
    if ((d.direction || []).length)
      h += '<section class="sec"><h2>추천 방향</h2>' + Block('div', ['direction'], 'dir', 'p') + '</section>';

    var cs = d.cases || [];
    if (cs.length){
      h += '<section class="sec"><h2>참고가 될 리얼워크 수행사례</h2><div class="cards">';
      for (i = 0; i < cs.length; i++) h += caseCard(cs[i], i);
      h += '</div></section>';
    }
    var vs = d.videos || [];
    if (vs.length){
      h += '<section class="sec"><h2>참고가 될 리얼워크 영상</h2><div class="cards">';
      for (i = 0; i < vs.length; i++) h += vidCard(vs[i], i);
      h += '</div></section>';
    }

    if (editing) h += '<p class="hint">회색 점선 안을 눌러 바로 고칩니다. 한 상자 안의 여러 문단은 한꺼번에 이어서 쓰거나 지울 수 있습니다. 되돌리려면 취소를 누르세요.' +
                      (LOCAL ? ' 저장을 누르면 이 파일에 그대로 덮어씁니다(처음 한 번만 파일을 고릅니다).' : '') + '</p>';
    if (note) h += '<p class="note' + (noteOk ? ' ok' : '') + '">' + esc(note) + '</p>';
    h += '<footer class="foot"><span class="foot-l"><span>REALWORK 리얼워크</span>' + toolbar() + '</span>' +
         '<a href="https://www.realwork.group" target="_blank" rel="noopener">www.realwork.group</a></footer>';
    return h + '</div>';
  }

  function render(){
    document.body.classList.toggle('editing', editing);
    root.innerHTML = bodyHtml();
  }

  function collect(){
    var i, nodes = root.querySelectorAll('[data-p]');
    for (i = 0; i < nodes.length; i++)
      setv(state, JSON.parse(nodes[i].getAttribute('data-p')), norm(nodes[i].innerText));
    var blocks = root.querySelectorAll('[data-parr]');
    for (i = 0; i < blocks.length; i++){
      var parts = blocks[i].innerText.split(/\n+/), out = [];
      for (var j = 0; j < parts.length; j++){ var t = norm(parts[j]); if (t) out.push(t); }
      setv(state, JSON.parse(blocks[i].getAttribute('data-parr')), out);
    }
  }

  function fullDoc(){
    var style = document.getElementById('rw-style').textContent;
    var app = document.getElementById('rw-app').textContent;
    var json = JSON.stringify(state).replace(/</g, '\\u003c');
    var s = '<' + 'script', e = '<' + '/script>';
    return '<!doctype html><html lang="ko"><head><meta charset="utf-8">' +
      '<meta name="viewport" content="width=device-width, initial-scale=1">' +
      '<title>' + esc(state.client) + ' 유사 수행사례 제안</title>' +
      '<link rel="preconnect" href="https://fonts.googleapis.com">' +
      '<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>' +
      '<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">' +
      '<style id="rw-style">' + style + '</style></head><body>' +
      '<div id="rw-root"></div>' +
      s + ' type="application/json" id="rw-data">' + json + e +
      s + ' id="rw-app">' + app + e +
      '</body></html>';
  }

  function fileStem(){
    return (state._date || '') + '_[리얼워크]' + (state.client || '') + '_수행사례제안';
  }

  async function saveToFile(){
    var html = fullDoc();
    /* Chrome·Edge: 원래 파일에 그대로 덮어쓴다 (첫 저장 때만 파일을 고르고, 이후엔 조용히 저장) */
    if (window.showSaveFilePicker){
      try {
        if (!fileHandle){
          fileHandle = await window.showSaveFilePicker({
            suggestedName: fileStem() + '.html',
            types: [{ description: 'HTML', accept: { 'text/html': ['.html'] } }]
          });
        }
        var w = await fileHandle.createWritable();
        await w.write(html); await w.close();
        ORIG = JSON.stringify(state);
        editing = false; busy = false; noteOk = true; note = '저장했습니다.'; render();
        setTimeout(function(){ if (noteOk){ note = ''; noteOk = false; render(); } }, 2500);
        return;
      } catch (err){
        if (err && err.name === 'AbortError'){ busy = false; render(); return; }   /* 취소 */
        fileHandle = null;   /* 실패하면 아래 다운로드로 */
      }
    }
    /* Safari·Firefox: 새 파일로 내려받는다 */
    var blob = new Blob([html], {type: 'text/html;charset=utf-8'});
    var a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = fileStem() + '.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1500);
    ORIG = JSON.stringify(state);
    editing = false; busy = false; noteOk = true;
    note = '수정본을 내려받았습니다. 이 브라우저는 파일에 바로 덮어쓰기를 지원하지 않아 새 파일로 저장됩니다.'; render();
  }

  async function doSave(){
    collect();
    if (LOCAL){ saveToFile(); return; }
    busy = true; note = ''; render();
    if (dbDoc){
      try {
        await dbDoc.set({ bv: state._bv || '', at: Date.now(), content: contentOf(state) });
        busy = false; editing = false; note = ''; render();
      } catch (err){
        busy = false;
        var dc = err && err.code;
        note = (dc === 'invalid_argument' || dc === 'not_granted')
          ? '이 문서를 저장할 권한이 없습니다. 리얼워크 계정으로 로그인했는지 확인해 주세요.'
          : '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.';
        render();
      }
      return;
    }
    if (!artifactNS){ busy = false; note = '이 화면에서는 저장할 수 없습니다.'; render(); return; }
    try {
      await artifactNS.publish(fullDoc());
    } catch (err){
      busy = false;
      var c = err && err.code;
      if (c === 'conflict') return;
      note = (c === 'not_writer' || c === 'not_granted')
        ? '이 문서를 편집할 권한이 없습니다. 읽기만 가능합니다.'
        : (c === 'rate_limited' ? '저장이 너무 잦습니다. 잠시 후 다시 눌러 주세요.'
                                : '저장하지 못했습니다. 잠시 후 다시 시도해 주세요.');
      render();
    }
  }

  root.addEventListener('click', function(ev){
    var del = ev.target.closest('.rw-del, .rw-x');
    if (del){ collect(); delv(state, JSON.parse(del.getAttribute('data-d'))); render(); return; }
    var btn = ev.target.closest('.tb');
    if (!btn) return;
    var a = btn.getAttribute('data-a');
    if (a === 'edit'){ editing = true; note = ''; noteOk = false; render(); window.scrollTo({top: 0, behavior: 'smooth'}); }
    else if (a === 'cancel'){ state = JSON.parse(ORIG); editing = false; note = ''; render(); }
    else if (a === 'save'){ doSave(); }
    else if (a === 'print'){ window.print(); }
  });

  render();

  function applySaved(rec){
    if (!rec || !rec.content) return false;
    if ((rec.bv || '') !== (state._bv || '')) return false;   /* 새 버전이 게시되면 무시 */
    var next = attachAssets(rec.content);
    next._bv = state._bv; next._date = state._date;
    state = next;
    ORIG = JSON.stringify(state);
    return true;
  }

  if (window.claude && claude.use){
    claude.use('artifact').then(function(ns){ artifactNS = ns; }).catch(function(){});
    claude.use('db').then(function(db){
      if (!db) return;
      dbDoc = db.doc('doc/current');
      dbDoc.onSnapshot(function(snap){
        if (editing || busy || applying) return;
        var rec = snap && (snap.data ? (typeof snap.data === 'function' ? snap.data() : snap.data) : null);
        applying = true;
        if (applySaved(rec)) render();
        applying = false;
      }, function(){});
    }).catch(function(){});
  }
})();
</script>

</body>
</html>
